name: Setup Loupist CI toolchains
description: Install pinned Node, Rust, Python, and uv, with optional Rust cache
inputs:
  node:
    default: "false"
  node-cache:
    default: apps/loupist/package-lock.json
  cache-npm:
    description: Enable npm download cache (disable in privileged release jobs)
    default: "true"
  rust:
    default: "false"
  rust-components:
    default: ""
  rust-targets:
    default: ""
  rust-cache-key:
    default: ""
  python:
    default: "false"
runs:
  using: composite
  steps:
    - name: Install pinned Node LTS
      if: ${{ inputs.node == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
        cache: ${{ inputs.cache-npm == 'true' && 'npm' || '' }}
        cache-dependency-path: ${{ inputs.node-cache }}

    - name: Install Rust
      if: ${{ inputs.rust == 'true' }}
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: 1.97.1
        components: ${{ inputs.rust-components }}
        targets: ${{ inputs.rust-targets }}

    - name: Cache Rust workspaces
      if: ${{ inputs.rust == 'true' && inputs.rust-cache-key != '' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: |
          apps/loupist/src-tauri -> target
        shared-key: ${{ inputs.rust-cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install Python 3.12
      if: ${{ inputs.python == 'true' }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.12"

    - name: Install uv
      if: ${{ inputs.python == 'true' }}
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.11.2
        enable-cache: true
        cache-dependency-glob: |
          apps/loupist/openbb/uv.lock
