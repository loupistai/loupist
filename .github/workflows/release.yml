name: Loupist Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify with disposable keys; publish nothing
        type: boolean
        default: true
      run_full_ci:
        description: Also repeat full source and native CI during a dry run
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: loupist-release
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    timeout-minutes: 15
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.identity.outputs.dry_run }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      signing_mode: ${{ steps.profile.outputs.signing_mode }}
      channel: ${{ steps.profile.outputs.channel }}
      certificate_sha1: ${{ steps.profile.outputs.certificate_sha1 }}
      certificate_sha256: ${{ steps.profile.outputs.certificate_sha256 }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      macos_bundle_version: ${{ steps.macos_bundle_version.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - id: identity
        name: Match tag and package versions
        shell: bash
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./apps/loupist/package.json').version")"
          test "$GITHUB_REPOSITORY" = "loupistai/loupist"
          python3 apps/loupist/scripts/set-version.py --check --version "$APP_VERSION"
          node apps/loupist/scripts/check-market-calendar.mjs
          if [[ "$DRY_RUN" != true ]]; then
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          fi
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$APP_VERSION" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.([1-9][0-9]*)$ ]]; then
            PRERELEASE=true
          elif [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            PRERELEASE=false
          else
            echo "Releases must use canonical X.Y.Z or X.Y.Z-rc.N without build metadata." >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: profile
        name: Read the tag-bound release profile
        run: python3 apps/loupist/scripts/release_profile.py >> "$GITHUB_OUTPUT"

      - id: macos_bundle_version
        name: Allocate a monotonic macOS bundle build number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          METADATA_DIRECTORY="$RUNNER_TEMP/retained-release-metadata"
          RELEASE_TAGS="$RUNNER_TEMP/retained-release-tags.txt"
          mkdir -p "$METADATA_DIRECTORY"
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --json tagName \
            --jq '.[].tagName' > "$RELEASE_TAGS"
          release_index=0
          while IFS= read -r release_tag; do
            test -n "$release_tag"
            release_index=$((release_index + 1))
            destination="$METADATA_DIRECTORY/$release_index"
            mkdir "$destination"
            gh release download "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern RELEASE-METADATA.json \
              --dir "$destination"
          done < "$RELEASE_TAGS"
          MACOS_BUNDLE_VERSION="$(
            python3 apps/loupist/scripts/next-macos-bundle-version.py \
              --run-number "$GITHUB_RUN_NUMBER" \
              --release-metadata-directory "$METADATA_DIRECTORY"
          )"
          [[ "$MACOS_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          echo "value=$MACOS_BUNDLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Require exact source commit to have passed protected CI
        if: steps.identity.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          gh api --paginate \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_COMMIT&status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, .path, .head_sha, .status, .conclusion, .head_repository.full_name, .repository.full_name, .event, .head_branch] | @tsv' \
            > "$RUNNER_TEMP/ci-runs.tsv"
          VERIFIED_RUN_ID="$(
            awk -F '\t' -v sha="$SOURCE_COMMIT" -v repository="$GITHUB_REPOSITORY" '
              $2 == ".github/workflows/ci.yml" &&
              $3 == sha &&
              $4 == "completed" &&
              $5 == "success" &&
              $6 == repository &&
              $7 == repository &&
              $8 == "push" &&
              $9 == "main" { print $1; exit }
            ' "$RUNNER_TEMP/ci-runs.tsv"
          )"
          test -n "$VERIFIED_RUN_ID" || {
            echo "release source commit has no successful exact-SHA ci.yml run" >&2
            exit 1
          }
          echo "verified exact-source CI run $VERIFIED_RUN_ID"

      - name: Require ordered candidates and recorded burned tags
        if: steps.identity.outputs.dry_run != 'true' && steps.identity.outputs.prerelease == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLISHED_TAGS="$RUNNER_TEMP/published-release-tags.txt"
          gh api --paginate \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .published_at != null) | .tag_name' \
            > "$PUBLISHED_TAGS"
          git tag --list 'v*-rc.*' > "$RUNNER_TEMP/existing-rc-tags.txt"
          python3 apps/loupist/scripts/release-qualification.py rc-sequence \
            --candidate-tag "$GITHUB_REF_NAME" \
            --published-tags "$PUBLISHED_TAGS" \
            --existing-tags "$RUNNER_TEMP/existing-rc-tags.txt"

      - name: Require dated changelog for stable release
        if: steps.identity.outputs.dry_run != 'true' && steps.identity.outputs.prerelease == 'false'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import date
          import os
          from pathlib import Path
          import re

          version = os.environ["RELEASE_VERSION"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          unreleased_heading = f"## {version} - Unreleased"
          if unreleased_heading in lines:
              raise SystemExit(
                  f"Stable release cannot retain {unreleased_heading!r}."
              )
          heading = re.compile(
              rf"^## {re.escape(version)} - ([0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}})$"
          )
          matches = [heading.fullmatch(line) for line in lines]
          matches = [match for match in matches if match is not None]
          if len(matches) != 1:
              raise SystemExit(
                  f"Stable release requires exactly one '## {version} - YYYY-MM-DD' heading."
              )
          try:
              date.fromisoformat(matches[0].group(1))
          except ValueError as error:
              raise SystemExit(f"Stable release heading has an invalid date: {error}")
          PY

      - name: Require published release candidate before stable release
        if: steps.identity.outputs.dry_run != 'true' && steps.identity.outputs.prerelease == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          PUBLISHED_RC_TAGS="$(
            gh api --paginate \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == true and .published_at != null) | .tag_name'
          )"
          MATCHING_RC=false
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([1-9][0-9]*)$ ]] \
              && [[ "${BASH_REMATCH[1]}" == "$RELEASE_VERSION" ]]; then
              MATCHING_RC=true
              break
            fi
          done <<< "$PUBLISHED_RC_TAGS"
          if [[ "$MATCHING_RC" != true ]]; then
            echo "Stable release requires an already published, non-draft v${RELEASE_VERSION}-rc.N prerelease." >&2
            exit 1
          fi

      - name: Validate release configuration
        run: |
          python3 apps/loupist/scripts/check-macos-bundle-version.py \
            --tauri-config apps/loupist/src-tauri/tauri.conf.json \
            --source-plist apps/loupist/src-tauri/Info.plist
          python3 apps/loupist/scripts/check-release-configuration.py

  full-ci:
    name: Full release validation
    if: needs.validate.outputs.dry_run != 'true' || inputs.run_full_ci
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  build-macos:
    timeout-minutes: 90
    name: macOS arm64 release build
    needs: [validate, full-ci]
    if: always() && needs.validate.result == 'success' && (needs.full-ci.result == 'success' || (needs.validate.outputs.dry_run == 'true' && needs.full-ci.result == 'skipped'))
    runs-on: macos-15
    environment: ${{ needs.validate.outputs.dry_run == 'true' && 'release-dry-run' || 'release' }}
    env:
      LOUPIST_MACOS_SIGNING_MODE: ${{ needs.validate.outputs.dry_run == 'true' && 'self-signed' || needs.validate.outputs.signing_mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install CI toolchains
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          cache-npm: "false"
          rust: "true"
          rust-targets: aarch64-apple-darwin
          rust-cache-key: package-smoke
          python: "true"

      - name: Install renderer dependencies
        working-directory: apps/loupist
        run: npm ci

      - name: Require release credentials
        if: needs.validate.outputs.dry_run != 'true'
        env:
          LOUPIST_UPDATER_PUBLIC_KEY: ${{ secrets.LOUPIST_UPDATER_PUBLIC_KEY }}
          LOUPIST_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LOUPIST_TAURI_SIGNING_PRIVATE_KEY }}
          LOUPIST_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LOUPIST_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LOUPIST_SELF_SIGNED_CERTIFICATE: ${{ secrets.LOUPIST_SELF_SIGNED_CERTIFICATE }}
          LOUPIST_SELF_SIGNED_CERTIFICATE_PASSWORD: ${{ secrets.LOUPIST_SELF_SIGNED_CERTIFICATE_PASSWORD }}
          LOUPIST_APPLE_CERTIFICATE: ${{ secrets.LOUPIST_APPLE_CERTIFICATE }}
          LOUPIST_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.LOUPIST_APPLE_CERTIFICATE_PASSWORD }}
          LOUPIST_APPLE_SIGNING_IDENTITY: ${{ secrets.LOUPIST_APPLE_SIGNING_IDENTITY }}
          LOUPIST_APPLE_ID: ${{ secrets.LOUPIST_APPLE_ID }}
          LOUPIST_APPLE_PASSWORD: ${{ secrets.LOUPIST_APPLE_PASSWORD }}
          LOUPIST_APPLE_TEAM_ID: ${{ secrets.LOUPIST_APPLE_TEAM_ID }}
        run: python3 apps/loupist/scripts/release_credentials.py require

      - name: Generate disposable dry-run signing keys
        if: needs.validate.outputs.dry_run == 'true'
        run: python3 apps/loupist/scripts/release_credentials.py ephemeral

      - name: Import the selected signing certificate
        env:
          DRY_RUN: ${{ needs.validate.outputs.dry_run }}
          LOUPIST_CERTIFICATE: ${{ needs.validate.outputs.signing_mode == 'developer-id' && secrets.LOUPIST_APPLE_CERTIFICATE || secrets.LOUPIST_SELF_SIGNED_CERTIFICATE }}
          LOUPIST_CERTIFICATE_PASSWORD: ${{ needs.validate.outputs.signing_mode == 'developer-id' && secrets.LOUPIST_APPLE_CERTIFICATE_PASSWORD || secrets.LOUPIST_SELF_SIGNED_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          # No empty-array expansion: macOS ships bash 3.2, where "${args[@]}" of an
          # empty array is an unbound variable under `set -u`.
          if [[ "$DRY_RUN" == true ]]; then
            python3 apps/loupist/scripts/release_credentials.py import --dry-run
          else
            python3 apps/loupist/scripts/release_credentials.py import
          fi

      - name: Configure embedded updater
        shell: bash
        env:
          LOUPIST_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          LOUPIST_MACOS_BUNDLE_VERSION: ${{ needs.validate.outputs.macos_bundle_version }}
        run: |
          set -euo pipefail
          RELEASE_CONFIG="$RUNNER_TEMP/loupist-tauri-release.json"
          python3 apps/loupist/scripts/create-release-config.py \
            --platform macos \
            --version "$LOUPIST_RELEASE_VERSION" \
            --macos-bundle-version "$LOUPIST_MACOS_BUNDLE_VERSION" \
            --release-config apps/loupist/src-tauri/tauri.release.conf.json \
            --output "$RELEASE_CONFIG"
          python3 - "$RELEASE_CONFIG" "$LOUPIST_MACOS_BUNDLE_VERSION" <<'PY'
          import json
          import sys

          config = json.load(open(sys.argv[1], encoding="utf-8"))
          assert config["bundle"]["macOS"]["bundleVersion"] == sys.argv[2]
          PY
          echo "LOUPIST_TAURI_RELEASE_CONFIG=$RELEASE_CONFIG" >> "$GITHUB_ENV"

      - name: Stage and sign sidecars and OpenBB runtime
        env:
          LOUPIST_REQUIRE_DISTRIBUTION_SIGNING: "1"
        run: apps/loupist/scripts/stage-macos-arm64.sh

      - name: Build and sign unnotarized Loupist
        if: needs.validate.outputs.dry_run == 'true' || needs.validate.outputs.signing_mode != 'developer-id'
        working-directory: apps/loupist
        env:
          DRY_RUN: ${{ needs.validate.outputs.dry_run }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LOUPIST_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LOUPIST_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${TAURI_CONFIG:-}"
          test -s "$LOUPIST_TAURI_RELEASE_CONFIG"
          if [[ "$DRY_RUN" == true ]]; then
            python3 scripts/release_credentials.py build --dry-run
          else
            python3 scripts/release_credentials.py build
          fi

      - name: Build, sign, and notarize Loupist with Developer ID
        if: needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.signing_mode == 'developer-id'
        working-directory: apps/loupist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LOUPIST_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LOUPIST_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.LOUPIST_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.LOUPIST_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.LOUPIST_APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${TAURI_CONFIG:-}"
          test -s "$LOUPIST_TAURI_RELEASE_CONFIG"
          python3 scripts/release_credentials.py build

      - name: Notarize and staple the DMG
        if: needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.signing_mode == 'developer-id'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.LOUPIST_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.LOUPIST_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.LOUPIST_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="apps/loupist/src-tauri/target/aarch64-apple-darwin/release/bundle"
          shopt -s nullglob
          DMGS=("$BUNDLE_ROOT"/dmg/*.dmg)
          test "${#DMGS[@]}" -eq 1
          NOTARY_RESULT="$RUNNER_TEMP/loupist-dmg-notary.json"
          xcrun notarytool submit "${DMGS[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$NOTARY_RESULT"
          python3 - "$NOTARY_RESULT" <<'PY'
          import json
          import sys

          result = json.load(open(sys.argv[1], encoding="utf-8"))
          if result.get("status") != "Accepted":
              raise SystemExit(f"DMG notarization was not accepted: {result}")
          PY
          xcrun stapler staple "${DMGS[0]}"

      - name: Verify signatures, notarization, and updater artifacts
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.LOUPIST_APPLE_TEAM_ID }}
          LOUPIST_MACOS_BUNDLE_VERSION: ${{ needs.validate.outputs.macos_bundle_version }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="apps/loupist/src-tauri/target/aarch64-apple-darwin/release/bundle"
          shopt -s nullglob
          APPS=("$BUNDLE_ROOT"/macos/*.app)
          DMGS=("$BUNDLE_ROOT"/dmg/*.dmg)
          UPDATERS=("$BUNDLE_ROOT"/macos/*.app.tar.gz)
          test "${#APPS[@]}" -eq 1
          test "${#DMGS[@]}" -eq 1
          test "${#UPDATERS[@]}" -eq 1
          APP_BUNDLE="${APPS[0]}"
          DMG="${DMGS[0]}"
          UPDATER="${UPDATERS[0]}"
          hdiutil verify "$DMG" >/dev/null
          python3 apps/loupist/scripts/check-macos-bundle-version.py \
            --tauri-config apps/loupist/src-tauri/tauri.conf.json \
            --source-plist apps/loupist/src-tauri/Info.plist \
            --expected-bundle-version "$LOUPIST_MACOS_BUNDLE_VERSION" \
            --bundle-plist "$APP_BUNDLE/Contents/Info.plist"
          PI_RUNTIME="$APP_BUNDLE/Contents/Resources/pi-runtime"
          PI_BINARY="$PI_RUNTIME/loupist-pi"
          test -x "$PI_BINARY"
          test -s "$APP_BUNDLE/Contents/Resources/LICENSE"
          test -s "$APP_BUNDLE/Contents/Resources/NOTICE"
          test -s "$APP_BUNDLE/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -s "$UPDATER.sig"
          python3 apps/loupist/scripts/macos_release_signing.py verify-bundle \
            --app "$APP_BUNDLE" --dmg "$DMG" \
            --release-config "$LOUPIST_TAURI_RELEASE_CONFIG" --report signing-report.json
          MOUNT_DIR="$(mktemp -d "$RUNNER_TEMP/loupist-dmg.XXXXXX")"
          DMG_ATTACHED=false
          cleanup_dmg_mount() {
            if [[ "$DMG_ATTACHED" == true ]]; then
              hdiutil detach "$MOUNT_DIR" >/dev/null
            fi
            rmdir "$MOUNT_DIR"
          }
          trap cleanup_dmg_mount EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          hdiutil attach "$DMG" \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT_DIR" >/dev/null
          DMG_ATTACHED=true
          MOUNTED_APP="$MOUNT_DIR/Loupist.app"
          test -d "$MOUNTED_APP"
          python3 apps/loupist/scripts/macos_release_signing.py verify-bundle \
            --app "$MOUNTED_APP" --dmg "$DMG" \
            --release-config "$LOUPIST_TAURI_RELEASE_CONFIG" --report mounted-signing-report.json
          python3 apps/loupist/scripts/macos_release_signing.py compare-reports \
            --expected signing-report.json --actual mounted-signing-report.json
          rm mounted-signing-report.json
          apps/loupist/scripts/check-macos-app-bundle.sh \
            "$MOUNTED_APP" \
            --expected-bundle-version "$LOUPIST_MACOS_BUNDLE_VERSION" \
            --require-distribution-trust
          hdiutil detach "$MOUNT_DIR" >/dev/null
          DMG_ATTACHED=false
          rmdir "$MOUNT_DIR"
          trap - EXIT HUP INT TERM

      - name: Normalize macOS release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 apps/loupist/scripts/prepare-release-assets.py \
            --platform macos \
            --version "$RELEASE_VERSION" \
            --bundle-root apps/loupist/src-tauri/target/aarch64-apple-darwin/release/bundle \
            --output release-assets

      - name: Upload signing facts and embedded updater public key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: loupist-signing-report
          path: signing-report.json
          if-no-files-found: error
          retention-days: ${{ needs.validate.outputs.dry_run == 'true' && 1 || 14 }}

      - name: Upload macOS release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: loupist-${{ needs.validate.outputs.version }}-macos-aarch64
          path: release-assets/*
          if-no-files-found: error
          retention-days: ${{ needs.validate.outputs.dry_run == 'true' && 1 || 14 }}

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${LOUPIST_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$LOUPIST_SIGNING_KEYCHAIN" || true
          fi
          rm -rf -- "$RUNNER_TEMP/loupist-ephemeral"
          rm -f -- \
            "$RUNNER_TEMP/loupist-signing.p12" \
            "$RUNNER_TEMP/loupist-tauri-release.json" \
            "$RUNNER_TEMP/loupist-dmg-notary.json"

  assemble:
    timeout-minutes: 30
    name: Assemble and verify release candidate
    if: always() && needs.validate.result == 'success' && needs.build-macos.result == 'success'
    needs:
      - validate
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Node LTS
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          cache-npm: "false"

      - name: Download signed macOS assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loupist-${{ needs.validate.outputs.version }}-macos-aarch64
          path: release-assets

      - name: Download signing report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loupist-signing-report
          path: signing-facts

      - name: Generate static updater manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 apps/loupist/scripts/generate-update-manifest.py \
            --version "$RELEASE_VERSION" \
            --tag "${{ needs.validate.outputs.release_tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --pub-date "$PUBLISHED_AT" \
            --assets release-assets \
            --output release-assets/latest.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.50.0
          path: .
          format: spdx-json
          output-file: release-assets/Loupist-${{ needs.validate.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize aliases, metadata, and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          LOUPIST_MACOS_BUNDLE_VERSION: ${{ needs.validate.outputs.macos_bundle_version }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ needs.validate.outputs.dry_run }}" == true ]]; then args+=(--allow-dry-run); fi
          python3 apps/loupist/scripts/finalize-release-assets.py \
            --version "$RELEASE_VERSION" \
            --tag "${{ needs.validate.outputs.release_tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "${{ needs.validate.outputs.source_commit }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --macos-bundle-version "$LOUPIST_MACOS_BUNDLE_VERSION" \
            --signing-report signing-facts/signing-report.json \
            ${args[@]+"${args[@]}"} --assets release-assets

      - name: Validate assembled release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          args=(--profile apps/loupist/release-profile.json --expected-certificate-sha256 "${{ needs.validate.outputs.certificate_sha256 }}")
          if [[ "${{ needs.validate.outputs.dry_run }}" == true ]]; then args=(--allow-dry-run); fi
          python3 apps/loupist/scripts/verify-release-assets.py "${args[@]}" \
            --version "$RELEASE_VERSION" \
            --tag "${{ needs.validate.outputs.release_tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "${{ needs.validate.outputs.source_commit }}" \
            --assets release-assets

      - name: Cryptographically verify updater packages against the configured public key
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          export LOUPIST_UPDATER_PUBLIC_KEY="$(python3 -c 'import json; print(json.load(open("signing-facts/signing-report.json"))["updater_public_key"])')"
          node apps/loupist/scripts/verify-updater-signatures.mjs \
            --version "$RELEASE_VERSION" \
            --assets release-assets

      - name: Upload the assembled closed asset set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: loupist-assembled-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: ${{ needs.validate.outputs.dry_run == 'true' && 1 || 14 }}

  publish:
    timeout-minutes: 30
    name: Publish verified candidate
    needs: [validate, assemble]
    if: needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Node LTS
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          cache-npm: "false"
      - name: Download the assembled closed asset set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loupist-assembled-release
          path: release-assets
      - name: Reverify release bytes and updater signature with the release key
        shell: bash
        env:
          LOUPIST_UPDATER_PUBLIC_KEY: ${{ secrets.LOUPIST_UPDATER_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          python3 apps/loupist/scripts/verify-release-assets.py \
            --version "$RELEASE_VERSION" --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" --source-commit "${{ needs.validate.outputs.source_commit }}" \
            --profile apps/loupist/release-profile.json --expected-certificate-sha256 "${{ needs.validate.outputs.certificate_sha256 }}" --assets release-assets
          node apps/loupist/scripts/verify-updater-signatures.mjs --version "$RELEASE_VERSION" --assets release-assets
      - name: Attest assembled candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Publish RC or stage stable draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          if gh release view "${{ needs.validate.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "Release already exists; immutable assets will not be replaced." >&2
            exit 1
          fi
          # Re-evaluate at publication: a failed-job rerun may have skipped validate.
          if [[ "$PRERELEASE" == true ]]; then
            gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .published_at != null) | .tag_name' \
              > "$RUNNER_TEMP/publish-release-tags.txt"
            git tag --list 'v*-rc.*' > "$RUNNER_TEMP/publish-rc-tags.txt"
            python3 apps/loupist/scripts/release-qualification.py rc-sequence \
              --candidate-tag "$GITHUB_REF_NAME" \
              --published-tags "$RUNNER_TEMP/publish-release-tags.txt" \
              --existing-tags "$RUNNER_TEMP/publish-rc-tags.txt"
          fi
          TITLE="Loupist $RELEASE_VERSION"
          if [[ "$RELEASE_CHANNEL" == beta ]]; then TITLE+=" (Beta)"; fi
          python3 apps/loupist/scripts/release-notes.py --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/release-notes.md"
          args=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --title "$TITLE"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--draft)
          fi
          gh release create "${args[@]}" release-assets/*
          if [[ "$PRERELEASE" == true ]]; then
            test "$(gh release view "${{ needs.validate.outputs.release_tag }}" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')" = $'false\ttrue'
            apps/loupist/scripts/verify-published-release.sh "${{ needs.validate.outputs.release_tag }}"
          else
            test "$(gh release view "${{ needs.validate.outputs.release_tag }}" --json isDraft --jq .isDraft)" = true
          fi
