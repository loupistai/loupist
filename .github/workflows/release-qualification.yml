name: Loupist Stable Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Stable draft tag (vMAJOR.MINOR.PATCH); select this same tag as the workflow ref
        required: true
        type: string
      predecessor_tag:
        description: Published stable or matching RC used for the N-1 to N update
        required: true
        type: string
      macos_update_evidence_url:
        description: HTTPS evidence for a clean macOS N-1 to N in-app update
        required: true
        type: string
      macos_candidate_set_sha256:
        description: SHA-256 of candidate SHA256SUMS used by the macOS update test
        required: true
        type: string
      macos_product_acceptance_evidence_url:
        description: Credential-free HTTPS evidence for the clean signed macOS Chat and Memory acceptance flow
        required: true
        type: string
      confirm_macos_update:
        description: I verified install, in-app update, restart, and retained data on macOS
        required: true
        default: false
        type: boolean
      confirm_macos_product_acceptance:
        description: I verified the V1 Chat and Memory acceptance flow on the clean signed macOS candidate
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  # Draft releases are listed and downloaded only by a token that can write contents.
  contents: write
  attestations: read

concurrency:
  group: loupist-qualification-${{ inputs.candidate_tag }}
  cancel-in-progress: false
  queue: max

jobs:
  identify:
    timeout-minutes: 15
    name: Pin draft candidate and qualified predecessor
    runs-on: ubuntu-latest
    environment: release-qualification
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the candidate tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_tag }}
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - id: release
        name: Require the exact unpublished stable draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          PREDECESSOR_TAG: ${{ inputs.predecessor_tag }}
          CONFIRM_MACOS: ${{ inputs.confirm_macos_update }}
          CONFIRM_MACOS_PRODUCT_ACCEPTANCE: ${{ inputs.confirm_macos_product_acceptance }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$CONFIRM_MACOS" = true
          test "$CONFIRM_MACOS_PRODUCT_ACCEPTANCE" = true
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$CANDIDATE_TAG"
          LATEST_RESPONSE="$RUNNER_TEMP/latest-release-response.txt"
          LATEST_ERROR="$RUNNER_TEMP/latest-release-error.txt"
          set +e
          gh api --include "/repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$LATEST_RESPONSE" 2> "$LATEST_ERROR"
          LATEST_EXIT=$?
          set -e
          LATEST_STATUS="$(awk 'NR == 1 { print $2 }' "$LATEST_RESPONSE")"
          case "$LATEST_STATUS" in
            200)
              test "$LATEST_EXIT" -eq 0
              LATEST_STABLE_TAG="$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
              ;;
            404)
              test "$LATEST_EXIT" -ne 0
              LATEST_STABLE_TAG=
              ;;
            *)
              echo "Unexpected GitHub latest-release response: ${LATEST_STATUS:-none}" >&2
              sed -n '1,5p' "$LATEST_ERROR" >&2
              exit 1
              ;;
          esac
          gh api --paginate --slurp \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/release-pages.json"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "$(git rev-parse "$GITHUB_SHA^{commit}")" = "$SOURCE_COMMIT"
          python3 - \
            "$RUNNER_TEMP/release-pages.json" \
            "$CANDIDATE_TAG" \
            "$PREDECESSOR_TAG" \
            "$SOURCE_COMMIT" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          pages = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit("paginated releases response is malformed")
          releases = [release for page in pages for release in page]
          tag = sys.argv[2]
          previous_tag = sys.argv[3]
          source_commit = sys.argv[4]
          matches = [release for release in releases if release["tag_name"] == tag]
          if len(matches) != 1:
              raise SystemExit("candidate tag must identify exactly one release")
          release = matches[0]
          if not release["draft"] or release["prerelease"] or release["published_at"] is not None:
              raise SystemExit("stable candidate must remain an unpublished non-prerelease draft")
          predecessors = [
              release for release in releases if release["tag_name"] == previous_tag
          ]
          if len(predecessors) != 1:
              raise SystemExit("qualified predecessor must identify exactly one release")
          predecessor = predecessors[0]
          if predecessor["draft"] or predecessor["published_at"] is None:
              raise SystemExit("qualified predecessor must already be published")
          print(f"release_id={release['id']}")
          print(f"source_commit={source_commit}")
          print(f"version={tag.removeprefix('v')}")
          PY
          python3 apps/loupist/scripts/release-qualification.py sequence \
            --candidate-tag "$CANDIDATE_TAG" \
            --previous-tag "$PREDECESSOR_TAG" \
            --latest-stable-tag "$LATEST_STABLE_TAG"

  platform-preflight:
    timeout-minutes: 60
    name: ${{ matrix.name }} signed package preflight
    needs: identify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            platform: macos
            asset: Loupist-macOS-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the candidate tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_tag }}
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Download the draft candidate without changing it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: gh release download "$CANDIDATE_TAG" --dir candidate-assets

      - name: Verify closed asset manifest and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.identify.outputs.version }}
          SOURCE_COMMIT: ${{ needs.identify.outputs.source_commit }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          python apps/loupist/scripts/verify-release-assets.py \
            --version "$RELEASE_VERSION" \
            --tag "$CANDIDATE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --assets candidate-assets
          apps/loupist/scripts/verify-release-attestations.sh \
            candidate-assets \
            "$GITHUB_REPOSITORY" \
            "$SOURCE_COMMIT" \
            "refs/tags/$CANDIDATE_TAG"

      - name: Verify macOS signature, notarization, and mounted identity
        if: matrix.platform == 'macos'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.identify.outputs.version }}
        run: |
          set -euo pipefail
          DMG="candidate-assets/Loupist-macOS-arm64.dmg"
          hdiutil verify "$DMG" >/dev/null
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          MACOS_BUNDLE_VERSION="$(
            python3 - candidate-assets/RELEASE-METADATA.json <<'PY'
          import json
          import re
          import sys

          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          bundle_version = metadata.get("macos_bundle_version")
          if not isinstance(bundle_version, str) or re.fullmatch(r"[1-9][0-9]*", bundle_version) is None:
              raise SystemExit("candidate metadata has no canonical macOS bundle version")
          print(bundle_version)
          PY
          )"
          MOUNT_DIR="$(mktemp -d "$RUNNER_TEMP/loupist-candidate.XXXXXX")"
          DMG_ATTACHED=false
          cleanup_dmg_mount() {
            if [[ "$DMG_ATTACHED" == true ]]; then
              hdiutil detach "$MOUNT_DIR" >/dev/null || true
            fi
            rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup_dmg_mount EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR" >/dev/null
          DMG_ATTACHED=true
          APP="$MOUNT_DIR/Loupist.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          python3 apps/loupist/scripts/check-macos-bundle-version.py \
            --tauri-config apps/loupist/src-tauri/tauri.conf.json \
            --source-plist apps/loupist/src-tauri/Info.plist \
            --expected-bundle-version "$MACOS_BUNDLE_VERSION" \
            --bundle-plist "$APP/Contents/Info.plist"
          hdiutil detach "$MOUNT_DIR" >/dev/null
          DMG_ATTACHED=false
          rmdir "$MOUNT_DIR"
          trap - EXIT HUP INT TERM
      - name: Record the native-tested candidate set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-digest
          python apps/loupist/scripts/release-qualification.py digest \
            --release-metadata candidate-assets/RELEASE-METADATA.json \
            > "qualification-digest/${{ matrix.platform }}.sha256"

      - name: Upload native candidate-set digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: loupist-native-candidate-${{ matrix.platform }}
          path: qualification-digest/${{ matrix.platform }}.sha256
          if-no-files-found: error
          retention-days: 90

  receipt:
    timeout-minutes: 15
    name: Seal qualification evidence
    needs:
      - identify
      - platform-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_tag }}
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Download the same draft candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: gh release download "$CANDIDATE_TAG" --dir candidate-assets

      - name: Download native candidate-set digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loupist-native-candidate-*
          path: qualification-digests
          merge-multiple: true

      - name: Reverify the exact candidate tested on macOS Apple Silicon
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_VERSION: ${{ needs.identify.outputs.version }}
          SOURCE_COMMIT: ${{ needs.identify.outputs.source_commit }}
        run: |
          set -euo pipefail
          python3 apps/loupist/scripts/verify-release-assets.py \
            --version "$RELEASE_VERSION" \
            --tag "$CANDIDATE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --assets candidate-assets
          apps/loupist/scripts/verify-release-attestations.sh \
            candidate-assets \
            "$GITHUB_REPOSITORY" \
            "$SOURCE_COMMIT" \
            "refs/tags/$CANDIDATE_TAG"
          CANDIDATE_SET_SHA256="$(
            python3 apps/loupist/scripts/release-qualification.py digest \
              --release-metadata candidate-assets/RELEASE-METADATA.json
          )"
          grep -Fqx "$CANDIDATE_SET_SHA256" qualification-digests/macos.sha256

      - name: Write qualification receipt
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          PREDECESSOR_TAG: ${{ inputs.predecessor_tag }}
          MACOS_EVIDENCE_URL: ${{ inputs.macos_update_evidence_url }}
          MACOS_CANDIDATE_SET_SHA256: ${{ inputs.macos_candidate_set_sha256 }}
          MACOS_PRODUCT_ACCEPTANCE_EVIDENCE_URL: ${{ inputs.macos_product_acceptance_evidence_url }}
          SOURCE_COMMIT: ${{ needs.identify.outputs.source_commit }}
          RELEASE_ID: ${{ needs.identify.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 apps/loupist/scripts/release-qualification.py write \
            --candidate-tag "$CANDIDATE_TAG" \
            --previous-tag "$PREDECESSOR_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --release-id "$RELEASE_ID" \
            --release-metadata candidate-assets/RELEASE-METADATA.json \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --macos-evidence-url "$MACOS_EVIDENCE_URL" \
            --macos-candidate-set-sha256 "$MACOS_CANDIDATE_SET_SHA256" \
            --macos-product-acceptance-evidence-url "$MACOS_PRODUCT_ACCEPTANCE_EVIDENCE_URL" \
            --output qualification/qualification.json

      - name: Upload qualification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: loupist-stable-qualification-${{ inputs.candidate_tag }}
          path: qualification/qualification.json
          if-no-files-found: error
          retention-days: 90
