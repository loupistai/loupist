name: Loupist CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      linux_native:
        description: Also run Linux WebKitGTK interaction and persistence for cloud-development validation
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Run every check for the caller's exact commit
        type: boolean
        default: true

permissions:
  contents: read

# A newer pull-request or main push cancels the older run. Main runs classify the
# range since the last green main push, so a cancelled run's changes stay in scope.
concurrency:
  group: loupist-ci-${{ (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Classify change scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      web: ${{ steps.scope.outputs.web }}
      python: ${{ steps.scope.outputs.python }}
      rust: ${{ steps.scope.outputs.rust }}
      native: ${{ steps.scope.outputs.native }}
      packaging: ${{ steps.scope.outputs.packaging }}
      macos: ${{ steps.platform.outputs.macos }}
      linux_native: ${{ steps.platform.outputs.linux_native }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the last green main push
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Classify affected surfaces
        id: scope
        env:
          CI_FORCE_FULL: ${{ (inputs.full || github.event_name == 'workflow_dispatch') && '1' || '0' }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || steps.base.outputs.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_MODE: ${{ github.event_name == 'pull_request' && 'merge-base' || 'direct' }}
        run: python3 apps/loupist/scripts/ci_change_scope.py

      - name: Select native platforms
        id: platform
        run: |
          echo "macos=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"
          echo "linux_native=${{ github.event_name == 'workflow_dispatch' && inputs.linux_native }}" >> "$GITHUB_OUTPUT"

      - name: Install pinned Node for dependency-free security checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Guide links, scope regressions, cloud setup syntax, credential boundaries
      # and toolchain pins: the same steps `verify.sh --affected` always runs.
      - name: Check repository guidance, scope regressions and security pins
        run: sh apps/loupist/scripts/check.sh repository

  verify-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 60
    name: Web contracts (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/2
            only: node-version,install-app,install-workspace-search,install-e2e,installed-dependencies,process-tools,repository-guidance,shell-syntax,tauri-e2e-config,module-syntax,node-contracts,e2e-security,i18n-literals,i18n-parity,ui-copy,design-tokens,boundaries,hooks-lint,market-calendar,unused-files,renderer-tests
          - shard: 2/2
            only: node-version,install-app,install-e2e,installed-dependencies,renderer-tests,chat-layout,renderer-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Node LTS
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          node-cache: |
            apps/loupist/package-lock.json
            apps/loupist/e2e/package-lock.json

      - name: Verify renderer and E2E tooling
        working-directory: apps/loupist
        env:
          ONLY: ${{ matrix.only }}
        run: |
          set -euo pipefail
          sh scripts/check.sh web --install --shard "${{ matrix.shard }}" ${ONLY:+--only "$ONLY"}

      - name: Retain web check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-web-${{ strategy.job-index }}
          path: apps/loupist/output/checks/*/
          retention-days: 7
          if-no-files-found: ignore

  verify-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    timeout-minutes: 60
    name: Python contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Python 3.12 and uv
        uses: ./.github/actions/setup-toolchains
        with:
          python: "true"

      - name: Verify OpenBB and repository scripts
        run: |
          set -euo pipefail
          sh apps/loupist/scripts/check.sh python --install

      - name: Retain python check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-python
          path: apps/loupist/output/checks/*/
          retention-days: 7
          if-no-files-found: ignore

  verify-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    name: Rust ${{ matrix.leg }} (Linux)
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: lint
            steps: format,clippy,e2e-feature-clippy
            runtime: "false"
            cache: verify-lint
          - leg: tests
            steps: tests,python-runtime-verify
            runtime: "true"
            cache: verify
          - leg: eval
            steps: headless-eval-contracts,python-sandbox-tests
            runtime: "true"
            cache: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Azure Ubuntu mirror can serve the 60 MB of WebKitGTK packages at 100 KB/s.
      - name: Restore Linux package downloads
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux native development libraries
        timeout-minutes: 15
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev procps lsof
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"

      - name: Save Linux package downloads
        if: github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Install Rust and runtime test toolchains
        uses: ./.github/actions/setup-toolchains
        with:
          node: ${{ matrix.runtime }}
          node-cache: |
            apps/loupist/package-lock.json
            apps/loupist/e2e/package-lock.json
          python: ${{ matrix.runtime }}
          rust: "true"
          rust-components: clippy,rustfmt
          rust-cache-key: ${{ matrix.cache }}

      # setup.sh stages the Python runtime as the runner user. apt above is the root step.
      - name: Install locked runtime test dependencies
        if: matrix.runtime == 'true'
        run: sh apps/loupist/scripts/setup.sh

      - name: Verify desktop Rust
        run: |
          set -euo pipefail
          sh apps/loupist/scripts/check.sh rust --only "${{ matrix.steps }}"

      - name: Retain rust check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-rust-linux-${{ matrix.leg }}
          path: apps/loupist/output/checks/*/
          retention-days: 7
          if-no-files-found: ignore

  native-e2e-linux:
    needs: changes
    if: needs.changes.outputs.native == 'true' && needs.changes.outputs.linux_native == 'true'
    timeout-minutes: 60
    name: Native Linux interaction (WebKitGTK)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore Linux package downloads
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-e2e-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux native development libraries and Xvfb
        timeout-minutes: 15
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev procps lsof xvfb
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"

      - name: Save Linux package downloads
        if: github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Install CI toolchains
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          node-cache: |
            apps/loupist/package-lock.json
            apps/loupist/e2e/package-lock.json
          rust: "true"
          rust-cache-key: e2e-linux

      - name: Install renderer dependencies
        working-directory: apps/loupist
        run: npm ci

      - name: Install native E2E dependencies
        working-directory: apps/loupist/e2e
        run: npm ci

      # Selected only when this native job runs. verify-rust keeps the Linux
      # runtime proof if native is later made opt-in. Staging is not the apt step.
      - name: Stage the pinned offline Python runtime
        run: python3 apps/loupist/scripts/stage_python_runtime.py --ensure

      # No DISPLAY is set, so the GUI lease starts a private Xvfb per suite.
      - name: Run native interaction regression suite
        working-directory: apps/loupist/e2e
        env:
          LOUPIST_E2E_STARTUP_TIMEOUT_MS: "900000"
        run: |
          npm run test:native:full
          npm run test:persistence

      - name: Retain native interaction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-evidence
          path: |
            apps/loupist/e2e/artifacts/native-*.png
            apps/loupist/e2e/artifacts/native-smoke-performance.json
            apps/loupist/e2e/artifacts/persistence/
          retention-days: 7
          if-no-files-found: ignore

  verify-rust-macos:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.macos == 'true'
    timeout-minutes: 60
    name: Rust ${{ matrix.leg }} (macOS)
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: lint
            steps: format,clippy,e2e-feature-clippy
            runtime: "false"
            cache: verify-lint
          - leg: tests
            steps: tests,python-runtime-verify
            runtime: "true"
            cache: verify
          - leg: eval
            steps: headless-eval-contracts,python-sandbox-tests
            runtime: "true"
            cache: verify
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust and runtime test toolchains
        uses: ./.github/actions/setup-toolchains
        with:
          node: ${{ matrix.runtime }}
          node-cache: |
            apps/loupist/package-lock.json
            apps/loupist/e2e/package-lock.json
          python: ${{ matrix.runtime }}
          rust: "true"
          rust-components: clippy,rustfmt
          rust-cache-key: ${{ matrix.cache }}

      - name: Install locked runtime test dependencies
        if: matrix.runtime == 'true'
        run: sh apps/loupist/scripts/setup.sh

      - name: Verify desktop Rust
        run: |
          set -euo pipefail
          sh apps/loupist/scripts/check.sh rust --only "${{ matrix.steps }}"

      - name: Retain rust check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-rust-macos-${{ matrix.leg }}
          path: apps/loupist/output/checks/*/
          retention-days: 7
          if-no-files-found: ignore

  native-e2e:
    needs: changes
    if: needs.changes.outputs.native == 'true' && needs.changes.outputs.macos == 'true'
    timeout-minutes: 60
    name: Native macOS interaction
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare macOS test display
        run: swift apps/loupist/e2e/prepare-ci-display.swift

      - name: Install CI toolchains
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          node-cache: |
            apps/loupist/package-lock.json
            apps/loupist/e2e/package-lock.json
          rust: "true"
          rust-cache-key: e2e
          python: "true"

      - name: Install renderer dependencies
        working-directory: apps/loupist
        run: npm ci

      - name: Install native E2E dependencies
        working-directory: apps/loupist/e2e
        run: npm ci

      - name: Stage verified unsigned macOS runtimes
        uses: ./.github/actions/stage-ci-runtimes

      - name: Run native interaction regression suite
        working-directory: apps/loupist/e2e
        env:
          LOUPIST_E2E_REQUIRE_STAGED_RUNTIMES: "1"
          # A fresh macOS runner must compile the Tauri test binary before its
          # WebDriver endpoint can bind. Local runs retain the five-minute default.
          LOUPIST_E2E_STARTUP_TIMEOUT_MS: "600000"
        run: |
          npm run test:native:full
          npm run test:persistence

      - name: Retain native interaction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-macos-evidence
          path: |
            apps/loupist/e2e/artifacts/native-*.png
            apps/loupist/e2e/artifacts/native-smoke-performance.json
            apps/loupist/e2e/artifacts/persistence/
          retention-days: 7
          if-no-files-found: ignore

  package-smoke:
    needs: changes
    if: needs.changes.outputs.packaging == 'true' && needs.changes.outputs.macos == 'true'
    timeout-minutes: 60
    name: Package smoke (aarch64-apple-darwin)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install CI toolchains
        uses: ./.github/actions/setup-toolchains
        with:
          node: "true"
          rust: "true"
          rust-targets: aarch64-apple-darwin
          rust-cache-key: package-smoke
          python: "true"

      - name: Install renderer dependencies
        working-directory: apps/loupist
        run: npm ci

      - name: Stage verified unsigned macOS runtimes
        uses: ./.github/actions/stage-ci-runtimes

      - name: Build unsigned package smoke
        working-directory: apps/loupist
        shell: bash
        run: >-
          npm exec -- tauri build
          --target aarch64-apple-darwin
          --bundles dmg
          --config src-tauri/tauri.package-smoke.conf.json

      - name: Verify mounted macOS package metadata
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="apps/loupist/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          shopt -s nullglob
          DMGS=("$BUNDLE_ROOT"/*.dmg)
          test "${#DMGS[@]}" -eq 1
          hdiutil verify "${DMGS[0]}" >/dev/null
          MOUNT_DIR="$(mktemp -d "$RUNNER_TEMP/loupist-dmg.XXXXXX")"
          DMG_ATTACHED=false
          detach_dmg_mount() {
            if [[ "$DMG_ATTACHED" != true ]]; then
              return
            fi
            if ! hdiutil detach "$MOUNT_DIR" >/dev/null; then
              hdiutil detach -force "$MOUNT_DIR" >/dev/null
            fi
            DMG_ATTACHED=false
          }
          cleanup_dmg_mount() {
            detach_dmg_mount
            rmdir "$MOUNT_DIR"
          }
          trap cleanup_dmg_mount EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          hdiutil attach "${DMGS[0]}" \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT_DIR" >/dev/null
          DMG_ATTACHED=true
          MOUNTED_APP="$MOUNT_DIR/Loupist.app"
          test -d "$MOUNTED_APP"
          apps/loupist/scripts/check-macos-app-bundle.sh "$MOUNTED_APP"
          detach_dmg_mount
          rmdir "$MOUNT_DIR"
          trap - EXIT HUP INT TERM

  verify:
    name: Source and product contracts
    timeout-minutes: 5
    needs:
      - changes
      - verify-web
      - verify-python
      - verify-rust
      - verify-rust-macos
      - native-e2e-linux
      - native-e2e
      - package-smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          WEB_REQUIRED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.verify-web.result }}
          PYTHON_REQUIRED: ${{ needs.changes.outputs.python }}
          PYTHON_RESULT: ${{ needs.verify-python.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.verify-rust.result }}
          RUST_MACOS_REQUIRED: ${{ needs.changes.outputs.rust == 'true' && needs.changes.outputs.macos == 'true' }}
          RUST_MACOS_RESULT: ${{ needs.verify-rust-macos.result }}
          NATIVE_LINUX_REQUIRED: ${{ needs.changes.outputs.native == 'true' && needs.changes.outputs.linux_native == 'true' }}
          NATIVE_LINUX_RESULT: ${{ needs.native-e2e-linux.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native == 'true' && needs.changes.outputs.macos == 'true' }}
          NATIVE_RESULT: ${{ needs.native-e2e.result }}
          PACKAGE_REQUIRED: ${{ needs.changes.outputs.packaging == 'true' && needs.changes.outputs.macos == 'true' }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          set -euo pipefail
          test "${{ needs.changes.result }}" = success
          require_scope() {
            case "$1:$2" in
              true:success|false:skipped) return 0 ;;
              *) echo "Unexpected check result: $1:$2" >&2; return 1 ;;
            esac
          }
          require_scope "$WEB_REQUIRED" "$WEB_RESULT"
          require_scope "$PYTHON_REQUIRED" "$PYTHON_RESULT"
          require_scope "$RUST_REQUIRED" "$RUST_RESULT"
          require_scope "$RUST_MACOS_REQUIRED" "$RUST_MACOS_RESULT"
          require_scope "$NATIVE_LINUX_REQUIRED" "$NATIVE_LINUX_RESULT"
          require_scope "$NATIVE_REQUIRED" "$NATIVE_RESULT"
          require_scope "$PACKAGE_REQUIRED" "$PACKAGE_RESULT"
