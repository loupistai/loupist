version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /apps/loupist
      - /apps/loupist/e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      pi-runtime:
        patterns: ["@earendil-works/*"]
      npm-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@earendil-works/*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/loupist/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      rust-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /apps/loupist/openbb
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
