version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-toolchains
      - /.github/actions/stage-ci-runtimes
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /apps/loupist
      - /apps/loupist/e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    ignore:
      - dependency-name: "@earendil-works/*"
      # Pinned with reviewed transitive overrides; e2e/verify-security.mjs
      # asserts the exact version, so a proposed bump can only fail CI.
      - dependency-name: "webdriverio"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/loupist/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      rust-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /apps/loupist/openbb
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "openbb*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ruff"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      openbb-family:
        patterns: ["openbb*"]
        update-types: [minor, patch]
      python-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["openbb*"]
        update-types: [minor, patch]
