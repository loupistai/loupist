name: Feature request
description: Suggest an improvement to Loupist.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What research task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the observable result you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
