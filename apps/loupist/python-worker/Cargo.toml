[package]
name = "loupist-python-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "cache", "gc", "gc-drc", "parallel-compilation"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p1"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
