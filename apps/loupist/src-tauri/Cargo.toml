[package]
name = "loupist-desktop"
version = "0.1.6"
edition = "2021"
rust-version = "1.97"
description = "Local native app for research with durable Loupist memory"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "loupist_desktop"
path = "src/lib.rs"

[features]
eval-harness = []
webdriver = ["dep:tauri-plugin-wdio-webdriver"]
e2e = ["webdriver"]

[[example]]
name = "agent_eval"
required-features = ["eval-harness"]

[[example]]
name = "world_eval"
required-features = ["eval-harness"]

[[example]]
name = "world_scale_eval"
required-features = ["eval-harness"]

[[example]]
name = "concurrent_eval"
required-features = ["eval-harness"]

[[bin]]
name = "loupist"
path = "src/main.rs"

[build-dependencies]
serde_json = "1"
sha2 = "0.11"
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
iana-time-zone = "0.1"
cfb = "0.14"
# Firefox's legacy-encoding detector, for web text that declares no charset.
chardetng = "1"
dom_smoothie = "0.19"
encoding_rs = "0.8"
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
model2vec-rs = { version = "0.4.0", default-features = false }
httpdate = "1.0.3"
htmd = "0.5"
office_oxide = { version = "=0.1.16", default-features = false }
open = "5.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
pdf_oxide = { version = "0.3.77", default-features = false, features = ["legacy-crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls-native-roots", "stream"] }
# Already in the tree through tokenizers; bounded entity-name admission patterns.
regex = "1"
rusqlite = { version = "0.41.1", features = ["backup", "bundled"] }
rfd = "0.17"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "=2.12.5", features = ["unstable", "tray-icon"] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-wdio-webdriver = { version = "=1.3.0", path = "vendor/tauri-plugin-wdio-webdriver", optional = true }
tempfile = "3"
# Not imported directly: selects the pure-Rust regex backend for model2vec-rs.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
thiserror = "2"
# Already in the tree through pdf_oxide; NFKC for the World trigram fallback.
unicode-normalization = "0.1"
unicode-segmentation = "=1.13.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml_edit = { version = "=0.20.2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
chrono-tz = "0.10.4"
serde_yaml_ng = "0.10"
ignore = "0.4.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "=2.14.1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString", "NSAppleEventManager", "NSAppleEventDescriptor"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
security-framework = "=3.7.0"
# OpenDART serves only TLS 1.2 with RSA key exchange, which rustls does not implement.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test", "unstable"] }
tokio = { version = "1", features = ["test-util"] }
# Test-only generator for src/contracts/generated; the pin keeps its output stable.
ts-rs = { version = "=12.0.1", features = ["chrono-impl", "no-serde-warnings", "serde-json-impl"] }

[workspace]
members = ["vendor/tauri-plugin-wdio-webdriver"]
default-members = ["."]
resolver = "2"

# Keep useful panic backtraces while reducing repeated dev/test build artifacts.
# For debugger variables: CARGO_PROFILE_DEV_DEBUG=full (TEST_DEBUG for tests).
[profile.dev]
debug = "line-tables-only"

# The embedding tokenizer registers 30,000 added words with a quadratic scan,
# compiled into model2vec-rs (which instantiates the tokenizer) as much as into
# tokenizers. Unoptimized, a debug model load takes over half a minute.
[profile.dev.package.tokenizers]
opt-level = 3

[profile.dev.package.model2vec-rs]
opt-level = 3
