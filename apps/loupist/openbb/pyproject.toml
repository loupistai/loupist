[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "loupist-openbb"
version = "1.0.0"
description = "Read-only OpenBB MCP sidecar for Loupist"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Loupist contributors" }]
dependencies = [
  # Base OpenBB plus only the extensions runtime-manifest.json can reach: its
  # providers and the econometrics, quantitative and technical routers.
  # `openbb[all]` would also bundle openbb-charting and Plotly, which no
  # Loupist Tool uses.
  "openbb==4.7.2",
  "openbb-alpha-vantage==1.6.1",
  "openbb-biztoc==1.6.1",
  "openbb-cboe==1.6.1",
  "openbb-deribit==1.2.1",
  "openbb-ecb==1.6.1",
  "openbb-econometrics==1.7.2",
  "openbb-famafrench==1.2.1",
  "openbb-finra==1.6.1",
  "openbb-finviz==1.5.1",
  "openbb-mcp-server==1.4.1",
  "openbb-multpl==1.3.1",
  "openbb-nasdaq==1.6.3",
  "openbb-quantitative==1.6.2",
  "openbb-seeking-alpha==1.6.1",
  "openbb-stockgrid==1.6.1",
  "openbb-technical==1.6.2",
  "openbb-tmx==1.5.2",
  "openbb-tradier==1.5.1",
  "openbb-wsj==1.6.1",
]

[project.scripts]
loupist-openbb = "loupist_openbb.server:main"

[dependency-groups]
dev = [
  "pyinstaller==6.22.3",
  "pytest>=8.3,<10",
  "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loupist_openbb"]

[tool.hatch.build.targets.wheel.force-include]
"runtime-manifest.json" = "loupist_openbb/runtime-manifest.json"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.uv]
package = true
# Security floors for the bundled HTTP, TLS, JWT and MCP closure. Keep the
# compatible major lines until the OpenBB integration is migrated with them.
constraint-dependencies = [
  "urllib3>=2.8.0", "pyjwt>=2.15.0",
  "aiohttp>=3.14.4,<4", "authlib>=1.9.1,<2", "certifi>=2026.10.19",
  "dnspython>=2.9.0", "fastmcp>=3.4.10,<4", "fastmcp-slim>=3.4.10,<4",
  "joserfc>=1.7.6,<2", "mcp>=1.30.0,<2", "multidict>=6.9.1,<7",
  "opentelemetry-api>=1.45.1,<2", "setuptools>=84.1.0",
]
